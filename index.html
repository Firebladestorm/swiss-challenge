<script>

'use strict';
(() => {
// ===================== Konstanten =====================
const W = 160, H = 144, HZ = 70, KY = 69, HWS = 80;
const PAL = ['#000000', '#555555', '#aaaaaa', '#ffffff'];
const SEG = 200, RWB = 700, CAMH = 1000, CD = 0.84, PZ = CAMH * CD, CS = 0.35, DRAW = 110, LW = 320;
let RW = 700;
const KMH = 40;               // km/h -> Welteinheiten pro Sekunde
const FIELD = 6;
const SAVE_KEY = 'swiss-challenge-v2';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const posmod = (a, n) => ((a % n) + n) % n;
function rngMk(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

// ===================== Framebuffer =====================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H);
const fb = new Uint8Array(W * H);
const RGB = PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
function present() {
  const d = img.data;
  for (let i = 0, j = 0; i < fb.length; i++, j += 4) { const c = RGB[fb[i]]; d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; d[j + 3] = 255; }
  ctx.putImageData(img, 0, 0);
}
function px(x, y, c) { if (x >= 0 && x < W && y >= 0 && y < H) fb[y * W + x] = c; }
function rect(x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  if (x1 <= x0) return;
  for (let yy = y0; yy < y1; yy++) fb.fill(c, yy * W + x0, yy * W + x1);
}
function span(y, x0, x1, c) {
  x0 = Math.max(0, Math.round(x0)); x1 = Math.min(W, Math.round(x1));
  if (y < 0 || y >= H || x1 <= x0) return;
  fb.fill(c, y * W + x0, y * W + x1);
}
function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
function panel(x, y, w, h, fill, line) { rect(x, y, w, h, fill); frame(x, y, w, h, line); }
function line(x0, y0, x1, y1, c) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (;;) { px(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function poly(pts, c) {
  let ymin = 1e9, ymax = -1e9;
  for (const p of pts) { ymin = Math.min(ymin, p[1]); ymax = Math.max(ymax, p[1]); }
  for (let y = Math.max(0, Math.floor(ymin)); y <= Math.min(H - 1, ymax); y++) {
    const xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((y >= a[1] && y < b[1]) || (y >= b[1] && y < a[1])) xs.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
    }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) span(y, xs[i], xs[i + 1] + 1, c);
  }
}



// Ton-Dithering: v in [0,3] -> Palettenindex mit 4x4 Bayer-Muster
function tone(v, x, y) { if (v <= 0) return 0; if (v >= 3) return 3; const b = Math.floor(v), f = v - b; return b + (BAYER[y & 3][x & 3] < f * 16 ? 1 : 0); }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// ===================== Sprites =====================
function mkSpr(w, h, ww, fn) {
  const d = new Uint8Array(w * h).fill(255);
  const P = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < w && y < h) d[y * w + x] = c; };
  const R = (x, y, rw, rh, c) => { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) P(x + i, y + j, c); };
  const G = (x, y) => (x >= 0 && y >= 0 && x < w && y < h) ? d[y * w + x] : 255;
  fn(P, R, w, h, G);
  return { w, h, ww, d };
}
function drawSpr(s, cx, by, dw, clipY, flip, fog, night, fade) {
  // Subpixel-genaue Skalierung (kein Zittern beim Heranzoomen), Unterkante fest am Boden
  if (dw < 1) dw = 1;
  const dh = dw * s.h / s.w, x0 = cx - dw / 2, yB = Math.round(by), y0 = yB - dh;
  const yEnd = Math.min(yB, clipY == null ? H : Math.ceil(clipY), H);
  const ya = Math.max(Math.ceil(y0 - 0.5), 0), xa = Math.max(Math.round(x0), 0), xb = Math.min(Math.round(x0 + dw), W);
  const kx = s.w / dw, ky = s.h / dh;
  for (let y = ya; y < yEnd; y++) {
    const sy = Math.min(s.h - 1, Math.max(0, ((y + 0.5 - y0) * ky) | 0)), row = sy * s.w;
    for (let x = xa; x < xb; x++) {
      let sx = ((x + 0.5 - x0) * kx) | 0; if (sx < 0 || sx >= s.w) continue; if (flip) sx = s.w - 1 - sx;
      let c = s.d[row + sx];
      if (c === 255) continue;
      if (fade && BAYER[y & 3][x & 3] < fade * 16) continue;
      if (night && c < 3) c = c === 0 ? 1 : 2;
      if (fog && BAYER[y & 3][x & 3] < fog.a * 16) c = fog.c;
      fb[y * W + x] = c;
    }
  }
}

// ===================== Schrift (Besitz: Art/Font-Helfer) =====================
// Neue Hauptschrift "GB-Grotesk": 5x7 Versalien (Zelle 8x8: Umlaut-Punkte in der Zeile darueber), proportional,
// 1px Zeichenabstand. Kompakte Zweitschrift 3x5 (alt, fuer sehr dichte Layouts wie die Werkstatt) per fontSmall(true).
// API (unveraendert):  textR(R,str,x,y,c,s) tw(str,s) text textC textRt textS textO textOR textOC

//      drawText(str,x,y,c,opts) mit opts {s, o:Umriss-Farbe, sh:Schatten-Farbe, align:'l'|'c'|'r', box:Hintergrundfarbe}
//      textWrap(str,maxW,s) -> Zeilen[], fontSmall(on)

const taHB = h => HZ - h;                                   // Hoehe ueber Horizont -> y

    for (let x = 0; x < 46; x++) { const c = [0, 3, 1, 2][(x >> 2) & 3]; R4(P, x, 18, 1, 6, c); } R4(P, 0, 17, 46, 1, 0); R4(P, 0, 23, 46, 1, 0);
    for (let x = 1; x < 46; x += 5) { R4(P, x, 14, 1, 4, 0); R4(P, x, 14, 4, 1, 0); }
    for (let x = 2, k = 0; x < 44; x += 4, k++) { const h = 6 + ((hash2(k, 5) * 3) | 0), arm = hash2(k, 6) < 0.6;
      R4(P, x, 17 - h, 2, h, hash2(k, 7) < 0.5 ? 0 : 1); R4(P, x, 14 - h, 2, 2, hash2(k, 8) < 0.5 ? 3 : 2);
      if (arm) { R4(P, x - 1, 10 - h, 1, 4, 0); R4(P, x + 2, 11 - h, 1, 3, 0); } }
  }, true);
}
function taTribuene() {                                        // Tribuene (Bern)
  return taMk(66, 44, 2.7, (P) => {
    taPoly(P, [[0, 6], [66, 0], [66, 6], [0, 11]], 0); taPoly(P, [[1, 7], [65, 2], [65, 4], [1, 9]], 3);
    for (let r = 0; r < 5; r++) { R4(P, 4 + r * 2, 15 + r * 5, 58 - r * 2, 2, (r & 1) ? 1 : 2); for (let x = 5 + r * 2; x < 60; x += 3) if (hash2(x, r + 40) < 0.8) { R4(P, x, 12 + r * 5, 2, 3, hash2(x, r) < 0.5 ? 0 : 1); P(x, 11 + r * 5, hash2(x, r + 3) < 0.5 ? 3 : 2); } }
    for (const x of [3, 31, 62]) R4(P, x, 8, 2, 36, 0);
    R4(P, 0, 40, 66, 4, 0); R4(P, 0, 41, 66, 1, 3);
  }, true);
}
function taBank() {
  return taMk(22, 12, 0.5, (P) => {
    R4(P, 1, 0, 20, 2, 1); R4(P, 1, 3, 20, 2, 1); R4(P, 0, 6, 22, 2, 0); R4(P, 1, 6, 20, 1, 2); R4(P, 2, 8, 2, 4, 0); R4(P, 18, 8, 2, 4, 0); R4(P, 2, 1, 1, 7, 0); R4(P, 19, 1, 1, 7, 0);
  });
}
function taGlobeLamp(night) {                                  // dreiarmiger Kandelaber mit Kugelleuchten
  return taMk(22, 46, 0.5, (P) => {
    R4(P, 10, 12, 2, 34, 0); R4(P, 10, 12, 1, 34, 1); R4(P, 8, 42, 6, 4, 0); R4(P, 9, 43, 4, 2, 2);
    taLine(P, 11, 14, 3, 9, 0); taLine(P, 11, 14, 19, 9, 0);
    for (const [gx, gy] of [[3, 6], [11, 2], [19, 6]]) { R4(P, gx - 1, gy + 3, 3, 2, 0); taEll(P, gx, gy, 2.5, 2.5, 3); P(gx, gy + 3, 0); if (night) for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) if (dx * dx + dy * dy <= 16 && dx * dx + dy * dy > 7 && ((dx + dy) & 1) === 0 && !(Math.abs(dx) < 3 && Math.abs(dy) < 3)) P(gx + dx, gy + dy, 2); }
  }, !!night);
}
function taCpSign() {                                          // Neon-Checkpoint-Schild
  return taMk(46, 40, 1.0, (P) => {
    R4(P, 22, 22, 2, 18, 0); R4(P, 23, 22, 1, 18, 1);
    R4(P, 0, 0, 46, 22, 0); R4(P, 1, 1, 44, 20, 3); R4(P, 2, 2, 42, 18, 0);
    for (let x = 3; x < 43; x += 2) { P(x, 3, 3); P(x, 18, 3); } for (let y = 4; y < 18; y += 2) { P(3, y, 3); P(42, y, 3); }
    textR(R4g(P), 'CHECK', 8, 7, 3, 1);
  }, true);
}
function taCheckGate() {                                       // Zielbogen-Schild "START" aehnlich: Zielflagge-Schild fuer Interlaken-Tor
  return taMk(50, 34, 1.1, (P) => {
    R4(P, 4, 10, 3, 24, 0); R4(P, 43, 10, 3, 24, 0); R4(P, 0, 0, 50, 14, 0);
    for (let y = 0; y < 14; y++) for (let x = 0; x < 50; x++) if (x > 0 && x < 49 && y > 0 && y < 13) P(x, y, (((x >> 2) + (y >> 2)) & 1) ? 0 : 3);
    R4(P, 9, 3, 32, 8, 0); R4(P, 10, 4, 30, 6, 3); textR(R4g(P), 'ZIEL', 14, 3, 0, 1);
  }, true);
}

// Dieses File erweitert die APU-Emulation aus part4.js nur über Hooks (WAVES, DRUM, sfx) – keine Engine-Änderung nötig.
//
// Melodie-Tokens (Lead, Kanal 1):  "<Stufe>:<Länge in 16teln><Mods>"   z.B. "5:4~"
//   Stufe: 1-7 mit b/# Vorzeichen und ' (Oktave hoch) / , (Oktave tief);  "@i" = i-ter Akkordton (aufsteigend ab Tonika-Lage);  R = Pause
//   Mods:  ~ Vibrato   / Slide von unten in die Note   \ Abfall-Slide am Ende   ! staccato   > Akzent

const CUP_DEFS = [
  { id: 'seeblick', n: 'SEEBLICK-CUP', locs: ['zuerich', 'luzern', 'genf', 'lugano'] },               // leichtester Cup
  { id: 'heimat', n: 'HEIMAT-CUP', locs: ['bern', 'thurgau', 'jura', 'lavaux'] },                     // Bern, Amriswil, Saignelégier, Lavaux
  { id: 'gipfel', n: 'GIPFEL-CUP', locs: ['interlaken', 'gotthard', 'zermatt', 'stmoritz'], partial: true }, // schwerster Cup
  { id: 'tour', n: 'TOUR DE SUISSE', all: true, credits: true }                                      // alle Strecken aus LOCS (8, später 12)

const CUPS = CUP_DEFS.map(d => { const idx = d.all ? LOCS.map((l, i) => i) : d.locs.map(id => LOCS.findIndex(l => l.id === id));
  const tracks = idx.filter(i => i >= 0), missing = d.all ? [] : d.locs.filter((id, k) => idx[k] < 0);
  return Object.assign({}, d, { tracks, missing, locked: !tracks.length || (missing.length > 0 && !d.partial) }); });

// Cup-Auto: gutes Serien-Setup (Stufe 2) – oder das Karriere-Auto, wo es besser ist
function cupCar() { const st = { tires: 2, motor: 2, gear: 2, brakes: 2, turbo: 1 }, u = save.up || {}; const r = {}; for (const k in st) r[k] = Math.max(st[k], u[k] || 0); return r; }

// rank 1 = Gold (hell, Stern-Krone, funkelt), 2 = Silber (hellgrau), 3 = Bronze (dunkel, kürzerer Fuss); Gravur 1/2/3
const POKAL_BIG = [
  '...00000000000000...',
  '000HBBBBBBBBBBBS0000',
  '0..0HBBBBBBBBBBS0..0',
  '0..0HBBBBBBBBBBS0..0',
  '0..0HBBBBBBBBBBS0..0',
  '.0.0HBBBBBBBBBBS0.0.',
  '..00HBBBBBBBBBBS00..',
  '...0HBBBBBBBBBBS0...',
  '...0HBBBBBBBBBSS0...',
  '....0HBBBBBBBBS0....',
  '....0HBBBBBBBSS0....',
  '.....0HBBBBBSS0.....',
  '......0HBBBSS0......',
  '.......00BS00.......',
  '........0BS0........',
  '........0BS0........',
  '.......0HBSS0.......',
  '......0HBBBSS0......',
  '....000000000000....',
  '....0SSSSSSSSSS0....',
  '....0SBSBSBSBSS0....',
  '....000000000000....'];
const POKAL_SMALL = ['.0000000.', '00HBBBS00', '0.0HBS0.0', '.00HBS00.', '...0S0...', '...0S0...', '..00000..', '..0SSS0..', '..00000..'];
function drawPokal(cx, by, rank, s, t) {
  t = t || 0; const small = (s || 1) < 1;

  let rows = small ? POKAL_SMALL : POKAL_BIG;

  const w = rows[0].length, h = rows.length, x0 = Math.round(cx - w / 2), y0 = by - h;
  rows.forEach((r, j) => { for (let i = 0; i < w; i++) { const ch = r[i]; if (ch !== '.') px(x0 + i, y0 + j, pal[ch]); } });
  if (small) return;

  if (rank === 1) { // Stern-Krone + Funkeln
    const sx = x0 + 9; ['..0..', '.030.', '03330', '.030.', '0...0'].forEach((r, j) => { for (let i = 0; i < 5; i++) if (r[i] !== '.') px(sx - 1 + i, y0 - 6 + j, +r[i]); });
    const ph = (t * 1.3) % 3; if (ph < 1) { const gx = x0 + 4 + Math.round(ph * 11), gy = y0 + 3; px(gx, gy - 2, 3); px(gx, gy + 2, 3); px(gx - 2, gy, 3); px(gx + 2, gy, 3); px(gx, gy, 3); }
  }
}
function pokalName(r) { return r === 1 ? 'GOLD' : r === 2 ? 'SILBER' : 'BRONZE'; }

{
  const rc = scenes.race, rEnter = rc.enter, rFinish = rc.finish, rDraw = rc.draw;

scenes.cupstand = {
  enter(info) {
    S.t = 0; S.info = info; engineSet(false); if (!info.jingled) musicPlay('hub');
    S.old = cupSorted().map(f => f.name);

    S.base = {}; CUP.field.forEach(f => { S.base[f.name] = f.pts; f.pts += S.add[f.name] || 0; });
    S.neu = cupSorted().map(f => f.name);
    CUP.k++; S.last = CUP.k >= CUPS[CUP.ci].tracks.length; S.ticked = 0;
  },
  update(dt) {
    S.t += dt;
    if (S.t > 0.7 && S.t < 1.9 && Math.floor(S.t * 12) !== S.ticked) { S.ticked = Math.floor(S.t * 12); if (sfx.move) sfx.move(); }
    if (S.t > 2.5 && !S.dn) { S.dn = 1; if (sfx.coin) sfx.coin(); }

      text(rk + '.', 6, yy + 3, fg);

      text(me ? 'DU' : f.name, 37, yy + 3, fg);
      const a = S.add[f.name] || 0;
      if (a && cnt < 1 && S.t > 0.3) { fontSmall(true); textRt('+' + a, 124, yy + 4, me ? 2 : 1, 1); fontSmall(false); }

    });
